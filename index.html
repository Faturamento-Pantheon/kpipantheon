<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pantheon · Painel de KPIs 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--p:#5A3A62;--d:#3E2745;--m:#8C6790;--g:#B79355;--l:#F6F1F7;--l2:#E4D5E6;--t:#2E2233}
*{box-sizing:border-box}body{margin:0;font-family:Calibri,Segoe UI,sans-serif;background:var(--l);color:var(--t)}
header{background:var(--d);color:#fff;padding:22px 32px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
h1{font-family:Georgia,serif;margin:0;font-size:28px;letter-spacing:2px}.tag{color:var(--g);font-size:11px;letter-spacing:3px;margin-top:4px}
.sub{background:var(--m);color:#fff;padding:8px 32px;font-size:13px;font-weight:600}
main{padding:24px 32px;max-width:1300px;margin:auto}
.filt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}.filt button{border:1px solid var(--l2);background:#fff;color:var(--p);padding:6px 12px;border-radius:16px;cursor:pointer;font-size:13px}
.filt button.on{background:var(--p);color:#fff;border-color:var(--p)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.card{background:#fff;border:1px solid var(--l2);border-top:3px solid var(--g);border-radius:10px;padding:14px 16px}
.card small{color:var(--m);font-size:11px;font-weight:700;letter-spacing:1px}.card b{display:block;font-family:Georgia,serif;font-size:22px;color:var(--d);margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px}
.box{background:#fff;border:1px solid var(--l2);border-radius:10px;padding:16px}.box h3{margin:0 0 10px;font-family:Georgia,serif;color:var(--p);font-size:15px}
.box canvas{max-height:300px}
table{width:100%;border-collapse:collapse;font-size:13px}th{background:var(--p);color:#fff;padding:7px;text-align:right}th:first-child,td:first-child{text-align:left}td{padding:6px 7px;text-align:right;border-bottom:1px solid var(--l2)}tr.tot td{background:var(--g);font-weight:700}
.note{font-size:12px;color:var(--m);margin-top:14px}
</style></head><body>
<header><div><h1>PANTHEON</h1><div class="tag">EMAGRECIMENTO • HIPERTROFIA • LONGEVIDADE</div></div><div style="font-size:13px;color:#C9A9CE">Painel de KPIs · 2026</div></header>
<div class="sub">PAINEL DE INDICADORES — JANEIRO A OUTUBRO 2026</div>
<main><div class="filt" id="f"></div><div class="cards" id="cards"></div>
<div class="grid"><div class="box"><h3>Faturamento por origem</h3><canvas id="c1"></canvas></div>
<div class="box"><h3>Atendimentos por serviço</h3><canvas id="c2"></canvas></div>
<div class="box"><h3>Recebido AMHPDF</h3><canvas id="c3"></canvas></div>
<div class="box"><h3>No-show e pacientes novos</h3><canvas id="c4"></canvas></div>
<div class="box" style="grid-column:1/-1"><h3>Serviços no período</h3><table id="t"></table></div></div>
<div class="note">Outubro: reembolso e mensagens de consulta ainda não lançados.</div></main>
<script>
const D={"meses": ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro"], "atend": [[401, 64, 256, 32, 16, 5, 264], [405, 48, 208, 33, 13, 10, 304], [447, 68, 258, 20, 9, 1, 258], [361, 83, 312, 26, 13, 0, 207], [380, 56, 331, 30, 17, 0, 240], [312, 60, 311, 37, 21, 2, 246], [385, 63, 396, 29, 21, 2, 288], [457, 53, 450, 53, 26, 1, 257], [405, 61, 435, 51, 39, 1, 323], [303, 53, 268, 57, 31, 2, 397]], "val": [[74488.85, 6733.61, 73733.5, 57163.8, 7062.17, 16700, 116212.91], [80344.54, 4873.8, 60011.99, 39785.34, 6874.93, 30700, 235404.06], [67695.59, 7379.22, 64318.31, 32865.01, 5952.64, 6400, 177582.75], [68625.99, 12569.18, 74304.58, 29948.82, 7612.72, 0, 121325.49], [67279.68, 7009.65, 75720.35, 38507.2, 6486.93, 0, 225047.21], [56933.82, 7545.72, 68972.14, 65480.73, 15027.54, 7500, 163855.82], [73605.38, 7658.09, 86936.92, 78439.21, 13800.06, 7410, 110725.66], [85739.3, 6029.34, 105459.46, 141781.42, 14836, 5220, 99244.34], [72130.81, 4860.37, 95516.76, 190297.82, 20961.49, 3800, 121198.94], [41000.45, 4104.76, 80978.15, 162484.51, 17375.71, 2800, 145066.05]], "fat": [[148135.04, 25342.43, 228681.62, 2800.36], [111515.95, 9006.96, 313555.57, 1300], [145806.6, 9342.1, 209569.25, 1458.76], [165252.2, 14220.45, 208995.25, 1202.27], [234647.3, 3291.58, 110739.67, 1083], [155158.17, 1825.4, 207954.6, 4690.17], [244228.66, 6535.94, 170433.23, 2424.26], [360555.94, 20763.72, 136193.36, 2648.69], [322238.12, 16558.13, 147883.94, 1742.28], [305943.58, null, 143866.05, 4000]], "amh": [43125.46, 37047.84, 95134.97, 117609.84, 96972.39, 170761.82, 141726.75, 161972.12, 204161.28, 249341.75], "pac": [[634, 188, 0.18], [580, 188, 0.14], [693, 166, 0.16], [533, 212, 0.16], ["-", 209, 0.16], ["-", 121, 0.2], [678, 176, 0.18], [496, 218, 0.21], [653, 156, 0.2], [null, 172, 0.23]], "serv": ["Consulta", "Nutrição", "Bioimpedância", "Ultrassonografia", "Polissonografia", "Implante", "Injetáveis"]};const N=D.meses.length;let sel=new Set(D.meses.map((_,i)=>i));
const S=a=>a.reduce((x,y)=>x+(+y||0),0);const R=v=>v==null?'—':'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const I=v=>v==null?'—':Math.round(v).toLocaleString('pt-BR');const P=v=>v==null?'—':(v*100).toFixed(1).replace('.',',')+'%';
const pal=['#5A3A62','#8C6790','#B79355','#C97BA8','#C9A9CE','#4C8C6B','#3E2745'];let ch={};
const idx=()=>[...sel].sort((a,b)=>a-b);
function mk(id,cfg){if(ch[id])ch[id].destroy();ch[id]=new Chart(document.getElementById(id),cfg)}
const opt=(st)=>({responsive:true,plugins:{legend:{position:'bottom'}},scales:{x:{stacked:st,grid:{display:false}},y:{stacked:st,grid:{color:'#E4D5E6'}}}});
function draw(){const ix=idx(),L=ix.map(i=>D.meses[i]);
const fat=ix.map(i=>S(D.fat[i])-(+D.fat[i][3]||0)),at=ix.map(i=>S(D.atend[i]));const F=S(fat),A=S(at);
const nv=S(ix.map(i=>D.pac[i][1])),ns=ix.map(i=>D.pac[i][2]).filter(v=>v!=null),am=S(ix.map(i=>D.amh[i]));
document.getElementById('cards').innerHTML=[['FATURAMENTO TOTAL',R(F)],['ATENDIMENTOS',I(A)],['TICKET MÉDIO',A?R(F/A):'—'],['PACIENTES NOVOS',I(nv)],['NO-SHOW MÉDIO',ns.length?P(S(ns)/ns.length):'—'],['RECEBIDO AMHPDF',R(am)]].map(([a,b])=>`<div class="card"><small>${a}</small><b>${b}</b></div>`).join('');
const fn=['Plano de saúde','Reembolso','Particular'];
mk('c1',{type:'bar',data:{labels:L,datasets:fn.map((n,k)=>({label:n,data:ix.map(i=>D.fat[i][k]),backgroundColor:pal[k]}))},options:opt(true)});
mk('c2',{type:'bar',data:{labels:L,datasets:D.serv.map((n,k)=>({label:n,data:ix.map(i=>D.atend[i][k]),backgroundColor:pal[k]}))},options:opt(true)});
mk('c3',{type:'bar',data:{labels:L,datasets:[{label:'Recebido',data:ix.map(i=>D.amh[i]),backgroundColor:'#5A3A62'}]},options:{...opt(false),plugins:{legend:{display:false}}}});
mk('c4',{data:{labels:L,datasets:[{type:'line',label:'No-show',data:ix.map(i=>D.pac[i][2]),borderColor:'#C97BA8',yAxisID:'y1',spanGaps:true},{type:'bar',label:'Pacientes novos',data:ix.map(i=>D.pac[i][1]),backgroundColor:'#B79355'}]},options:{responsive:true,plugins:{legend:{position:'bottom'}},scales:{y1:{position:'right',grid:{display:false},ticks:{callback:v=>(v*100)+'%'}}}}});
let h='<tr><th>Serviço</th><th>Atendimentos</th><th>Valor</th></tr>',tv=0;
D.serv.forEach((n,k)=>{const q=S(ix.map(i=>D.atend[i][k])),v=S(ix.map(i=>D.val[i][k]));tv+=v;h+=`<tr><td>${n}</td><td>${I(q)}</td><td>${R(v)}</td></tr>`});
h+=`<tr class="tot"><td>Total</td><td>${I(A)}</td><td>${R(tv)}</td></tr>`;document.getElementById('t').innerHTML=h}
const f=document.getElementById('f');
function btns(){f.innerHTML='<button data-a="1" class="'+(sel.size==N?'on':'')+'">Todos</button>'+D.meses.map((m,i)=>`<button data-i="${i}" class="${sel.has(i)&&sel.size<N?'on':''}">${m}</button>`).join('')}
f.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.a)sel=new Set(D.meses.map((_,i)=>i));else{const i=+b.dataset.i;if(sel.size==N)sel=new Set([i]);else{sel.has(i)?sel.delete(i):sel.add(i);if(!sel.size)sel=new Set(D.meses.map((_,i)=>i))}}btns();draw()};
btns();draw();
</script></body></html>
